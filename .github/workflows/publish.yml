name: brew pr-pull

on:
  workflow_run:
    workflows:
      - brew test-bot
    types:
      - completed
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    name: Pull bottles
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read # to read artifacts
      checks: read # to read check results
      contents: write # to push commits
      issues: read # to read PR labels
      pull-requests: write # to manage PR
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_PR: ${{ inputs.pull_request }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PULL_REQUEST="${INPUT_PR:-}"
          HEAD_SHA="${INPUT_HEAD_SHA:-}"

          if [[ -z "$PULL_REQUEST" && -f "${GITHUB_EVENT_PATH:-}" ]]; then
            PULL_REQUEST=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          fi

          if [[ -z "$HEAD_SHA" && -f "${GITHUB_EVENT_PATH:-}" ]]; then
            HEAD_SHA=$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")
          fi

          if [[ -z "$PULL_REQUEST" && -n "$EVENT_BRANCH" ]]; then
            PULL_REQUEST=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$EVENT_BRANCH" --state open --json number -q '.[0].number')
          fi

          if [[ -z "$PULL_REQUEST" ]]; then
            echo "Error: Could not determine pull request number." >&2
            exit 1
          fi

          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" "$PULL_REQUEST"
          else
            brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      - name: Push commits
        uses: Homebrew/actions/git-try-push@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          branch: main
