name: Release Formulae (Livecheck)

on:
  workflow_dispatch:
    inputs:
      formula:
        description: 'Formula to release (leave empty to check all)'
        required: false
        default: ''
  schedule:
    - cron: '0 5 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    name: Bump formulae
    runs-on: macos-26
    permissions:
      contents: write # to push commits
    steps:
      - name: Update formulae using Livecheck
        uses: dawidd6/action-homebrew-bump-formula@b12d2bc99c46444125e606142f28200ec71a1214 # v10
        with:
          token: ${{ secrets.COMMITTER_TOKEN }}
          tap: fraluc06/homebrew-ffmpeg-svt-av1-essential
          formula: ${{ inputs.formula }}
          livecheck: true
